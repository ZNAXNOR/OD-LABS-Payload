name: Build and Deploy Staging Image

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-image-deploy
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/znaxnor/od-labs-payload

jobs:
  build-and-deploy:
    name: Verify, publish and deploy staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out staging
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in STAGING_DATABASE_URL DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_APPLICATION_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Next.js types
        run: pnpm exec next typegen

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Create ephemeral build-only Payload secret
        shell: bash
        run: echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=http://localhost:3000
          secrets: |
            DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}
            PAYLOAD_SECRET=${{ env.PAYLOAD_SECRET }}
          cache-from: type=gha,scope=staging
          cache-to: type=gha,mode=max,scope=staging

      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          DOKPLOY_URL="${DOKPLOY_URL%/}"

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 \
            --request POST "${DOKPLOY_URL}/api/application.deploy" \
            --header "accept: application/json" \
            --header "Content-Type: application/json" \
            --header "x-api-key: ${DOKPLOY_API_KEY}" \
            --data "$(jq -n --arg applicationId "$DOKPLOY_APPLICATION_ID" '{applicationId: $applicationId}')"

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "### Staging image published"
            echo "- Image: `$IMAGE_NAME:staging`"
            echo "- Immutable image: `$IMAGE_NAME:sha-$GITHUB_SHA`"
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Dokploy deployment request: accepted"
          } >> "$GITHUB_STEP_SUMMARY"
