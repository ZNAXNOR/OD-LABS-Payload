name: Lighthouse Performance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  lighthouse:
    name: Mobile Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.15.1

      - name: Run mobile Lighthouse audits
        env:
          LHCI_URL: ${{ vars.LHCI_URL }}
        run: lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-reports
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 14
