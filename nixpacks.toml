# Nixpacks configuration for Dokploy deployment
[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = [
  "npm install -g pnpm@12.16.1 && mkdir -p /usr/local/bin && ln -sf $(npm config get prefix)/bin/pnpm /usr/local/bin/pnpm && ln -sf $(npm config get prefix)/bin/pnpm /usr/bin/pnpm",
  "pnpm i --frozen-lockfile"
]

[phases.build]
cmds = [
  "pnpm run build"
]

[start]
cmd = "pnpm run start"
